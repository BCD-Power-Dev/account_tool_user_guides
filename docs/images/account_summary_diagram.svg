<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <style>
    .box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2; rx: 6; }
    .box-header { fill: #3b82f6; stroke: #3b82f6; stroke-width: 2; rx: 8; }
    .box-section { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
    .box-item { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 4; }
    .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #1e293b; text-anchor: middle; }
    .text-white { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #ffffff; text-anchor: middle; font-weight: 600; }
    .text-section { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; font-weight: 600; }
    .text-item { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; fill: #64748b; text-anchor: start; }
    .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .arrow { fill: #94a3b8; }
  </style>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  
  <!-- Summary (Main) - Top -->
  <rect x="500" y="20" width="200" height="40" class="box-header"/>
  <text x="600" y="45" class="text-white">Summary (Main)</text>
  
  <!-- Line down -->
  <path d="M 600 60 L 600 85" class="line"/>
  <polygon points="600,90 595,82 605,82" class="arrow"/>
  
  <!-- Account Summary - Wide bar -->
  <rect x="50" y="95" width="1100" height="36" class="box-header"/>
  <text x="600" y="118" class="text-white">Account Summary</text>
  
  <!-- Lines down from Account Summary - 7 columns -->
  <path d="M 100 131 L 100 155" class="line"/>
  <path d="M 250 131 L 250 155" class="line"/>
  <path d="M 400 131 L 400 155" class="line"/>
  <path d="M 550 131 L 550 155" class="line"/>
  <path d="M 700 131 L 700 155" class="line"/>
  <path d="M 850 131 L 850 155" class="line"/>
  <path d="M 1000 131 L 1000 155" class="line"/>
  
  <!-- Arrows -->
  <polygon points="100,160 95,152 105,152" class="arrow"/>
  <polygon points="250,160 245,152 255,152" class="arrow"/>
  <polygon points="400,160 395,152 405,152" class="arrow"/>
  <polygon points="550,160 545,152 555,152" class="arrow"/>
  <polygon points="700,160 695,152 705,152" class="arrow"/>
  <polygon points="850,160 845,152 855,152" class="arrow"/>
  <polygon points="1000,160 995,152 1005,152" class="arrow"/>
  
  <!-- Section boxes (Row 2) - Main categories -->
  <!-- Account Detail -->
  <rect x="30" y="165" width="140" height="32" class="box-section"/>
  <text x="100" y="186" class="text-section">Account Detail</text>
  
  <!-- Status -->
  <rect x="180" y="165" width="140" height="32" class="box-section"/>
  <text x="250" y="186" class="text-section">Status</text>
  
  <!-- PCC / OID -->
  <rect x="330" y="165" width="140" height="32" class="box-section"/>
  <text x="400" y="186" class="text-section">PCC / OID</text>
  
  <!-- Standard Form of Payment -->
  <rect x="480" y="165" width="140" height="32" class="box-section"/>
  <text x="550" y="180" class="text-section">Standard Form</text>
  <text x="550" y="192" class="text-section">of Payment</text>
  
  <!-- Deal/Disc Codes -->
  <rect x="630" y="165" width="140" height="32" class="box-section"/>
  <text x="700" y="186" class="text-section">Deal/Disc Codes</text>
  
  <!-- Contacts -->
  <rect x="780" y="165" width="140" height="32" class="box-section"/>
  <text x="850" y="186" class="text-section">Contacts</text>
  
  <!-- Daytime Ops Hours -->
  <rect x="930" y="165" width="140" height="32" class="box-section"/>
  <text x="1000" y="180" class="text-section">Daytime Ops</text>
  <text x="1000" y="192" class="text-section">Hours</text>
  
  <!-- Connector lines to children -->
  <!-- Account Detail line -->
  <path d="M 100 197 L 100 215" class="line"/>
  <polygon points="100,220 95,212 105,212" class="arrow"/>
  
  <!-- Status line to OBT -->
  <path d="M 250 197 L 250 215" class="line"/>
  <polygon points="250,220 245,212 255,212" class="arrow"/>
  
  <!-- PCC/OID line to Region of Service -->
  <path d="M 400 197 L 400 215" class="line"/>
  <polygon points="400,220 395,212 405,212" class="arrow"/>
  
  <!-- Standard Form of Payment line to Point of Sale Tool -->
  <path d="M 550 197 L 550 215" class="line"/>
  <polygon points="550,220 545,212 555,212" class="arrow"/>
  
  <!-- Account Detail Items -->
  <rect x="20" y="225" width="160" height="530" class="box" style="stroke: #e2e8f0;"/>
  <rect x="28" y="233" width="144" height="22" class="box-item"/><text x="35" y="248" class="text-item">TSPM Number</text>
  <rect x="28" y="259" width="144" height="22" class="box-item"/><text x="35" y="274" class="text-item">GDS</text>
  <rect x="28" y="285" width="144" height="22" class="box-item"/><text x="35" y="300" class="text-item">GDS Profile Name</text>
  <rect x="28" y="311" width="144" height="22" class="box-item"/><text x="35" y="326" class="text-item">Traveler Profile</text>
  <rect x="28" y="337" width="144" height="22" class="box-item"/><text x="35" y="352" class="text-item">GCN</text>
  <rect x="28" y="363" width="144" height="22" class="box-item"/><text x="35" y="378" class="text-item">SMID</text>
  <rect x="28" y="389" width="144" height="22" class="box-item"/><text x="35" y="404" class="text-item">SQL ID</text>
  <rect x="28" y="415" width="144" height="22" class="box-item"/><text x="35" y="430" class="text-item">Back Office 1</text>
  <rect x="28" y="441" width="144" height="22" class="box-item"/><text x="35" y="456" class="text-item">Cust# / LCN 1</text>
  <rect x="28" y="467" width="144" height="22" class="box-item"/><text x="35" y="482" class="text-item">DK 1</text>
  <rect x="28" y="493" width="144" height="22" class="box-item"/><text x="35" y="508" class="text-item">Back Office 2</text>
  <rect x="28" y="519" width="144" height="22" class="box-item"/><text x="35" y="534" class="text-item">Cust# / LCN 2</text>
  <rect x="28" y="545" width="144" height="22" class="box-item"/><text x="35" y="560" class="text-item">DK 2</text>
  <rect x="28" y="571" width="144" height="22" class="box-item"/><text x="35" y="586" class="text-item">Acct Type/Segment</text>
  <rect x="28" y="597" width="144" height="22" class="box-item"/><text x="35" y="612" class="text-item">L1 Profile</text>
  <rect x="28" y="623" width="144" height="22" class="box-item"/><text x="35" y="638" class="text-item">L2 Profile</text>
  <rect x="28" y="649" width="144" height="22" class="box-item"/><text x="35" y="664" class="text-item">HR Feed</text>
  <rect x="28" y="675" width="144" height="22" class="box-item"/><text x="35" y="690" class="text-item">HR Feed Freq</text>
  <rect x="28" y="701" width="144" height="22" class="box-item"/><text x="35" y="716" class="text-item">E-Invoice Portal</text>
  <rect x="28" y="727" width="144" height="22" class="box-item"/><text x="35" y="742" class="text-item">E-Invoice Location</text>
  
  <!-- Status child: OBT -->
  <rect x="190" y="225" width="120" height="40" class="box" style="stroke: #e2e8f0;"/>
  <rect x="198" y="233" width="104" height="24" class="box-item"/>
  <text x="205" y="250" class="text-item">OBT</text>
  
  <!-- PCC/OID child: Region of Service Items -->
  <rect x="320" y="225" width="160" height="240" class="box" style="stroke: #e2e8f0;"/>
  <rect x="328" y="233" width="144" height="22" class="box-item"/><text x="335" y="248" class="text-item">Region of Service</text>
  <rect x="328" y="259" width="144" height="22" class="box-item"/><text x="335" y="274" class="text-item">Ops Region</text>
  <rect x="328" y="285" width="144" height="22" class="box-item"/><text x="335" y="300" class="text-item">Country of Serv.</text>
  <rect x="328" y="311" width="144" height="22" class="box-item"/><text x="335" y="326" class="text-item">BCD Team</text>
  <rect x="328" y="337" width="144" height="22" class="box-item"/><text x="335" y="352" class="text-item">HPA</text>
  <rect x="328" y="363" width="144" height="22" class="box-item"/><text x="335" y="378" class="text-item">APA</text>
  <rect x="328" y="389" width="144" height="22" class="box-item"/><text x="335" y="404" class="text-item">Trip Authorizer</text>
  <rect x="328" y="415" width="144" height="22" class="box-item"/><text x="335" y="430" class="text-item">NDC</text>
  
  <!-- Standard Form of Payment child: Point of Sale Tool -->
  <rect x="490" y="225" width="120" height="40" class="box" style="stroke: #e2e8f0;"/>
  <rect x="498" y="233" width="104" height="24" class="box-item"/>
  <text x="505" y="250" class="text-item">Point of Sale Tool</text>
  
  <!-- Legend -->
  <rect x="630" y="730" width="16" height="16" class="box-header" rx="3"/>
  <text x="655" y="742" class="text" style="text-anchor: start; font-size: 10px;">Main Section</text>
  
  <rect x="760" y="730" width="16" height="16" class="box-section" rx="3"/>
  <text x="785" y="742" class="text" style="text-anchor: start; font-size: 10px;">Category Header</text>
  
  <rect x="910" y="730" width="16" height="16" class="box-item" rx="3"/>
  <text x="935" y="742" class="text" style="text-anchor: start; font-size: 10px;">Data Field</text>
</svg>

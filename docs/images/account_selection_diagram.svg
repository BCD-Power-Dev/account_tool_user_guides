<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 350" width="950" height="350">
  <style>
    .box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2; rx: 8; }
    .box-header { fill: #3b82f6; stroke: #3b82f6; stroke-width: 2; }
    .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #1e293b; text-anchor: middle; }
    .text-white { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #ffffff; text-anchor: middle; font-weight: 600; }
    .line { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .arrow { fill: #94a3b8; }
  </style>
  
  <!-- Background -->
  <rect width="950" height="350" fill="#f8fafc"/>
  
  <!-- Account Selection (Top) - centered -->
  <rect x="375" y="20" width="200" height="44" class="box-header" rx="8"/>
  <text x="475" y="47" class="text-white">Account Selection</text>
  
  <!-- Connecting lines from top -->
  <path d="M 475 64 L 475 90" class="line"/>
  <path d="M 120 90 L 830 90" class="line"/>
  <path d="M 120 90 L 120 110" class="line"/>
  <path d="M 310 90 L 310 110" class="line"/>
  <path d="M 500 90 L 500 110" class="line"/>
  <path d="M 830 90 L 830 110" class="line"/>
  
  <!-- Arrows -->
  <polygon points="120,115 115,105 125,105" class="arrow"/>
  <polygon points="310,115 305,105 315,105" class="arrow"/>
  <polygon points="500,115 495,105 505,105" class="arrow"/>
  <polygon points="830,115 825,105 835,105" class="arrow"/>
  
  <!-- Level boxes (Row 2) -->
  <!-- GCN Level -->
  <rect x="50" y="120" width="140" height="40" class="box"/>
  <text x="120" y="145" class="text">GCN Level</text>
  
  <!-- Country (SMID) Level -->
  <rect x="220" y="120" width="180" height="40" class="box"/>
  <text x="310" y="145" class="text">Country (SMID) Level</text>
  
  <!-- Entity (LCN/TSPM) Level -->
  <rect x="420" y="120" width="160" height="40" class="box"/>
  <text x="500" y="138" class="text">Entity (LCN/TSPM)</text>
  <text x="500" y="153" class="text">Level</text>
  
  <!-- Favorites -->
  <rect x="760" y="120" width="140" height="40" class="box"/>
  <text x="830" y="145" class="text">Favorites</text>
  
  <!-- Connecting lines from Favorites -->
  <path d="M 830 160 L 830 190" class="line"/>
  <path d="M 640 190 L 830 190" class="line"/>
  <path d="M 640 190 L 640 210" class="line"/>
  <path d="M 830 190 L 830 210" class="line"/>
  
  <!-- Arrows for favorites children -->
  <polygon points="640,215 635,205 645,205" class="arrow"/>
  <polygon points="830,215 825,205 835,205" class="arrow"/>
  
  <!-- Favorites sub-boxes -->
  <!-- Country (SMID) Fav -->
  <rect x="545" y="220" width="190" height="40" class="box" style="stroke: #8b5cf6;"/>
  <text x="640" y="245" class="text">Country (SMID) Fav</text>
  
  <!-- Entity (LCN) Fav -->
  <rect x="755" y="220" width="150" height="40" class="box" style="stroke: #8b5cf6;"/>
  <text x="830" y="245" class="text">Entity (LCN) Fav</text>
  
  <!-- Legend -->
  <rect x="50" y="300" width="16" height="16" fill="#3b82f6" rx="3"/>
  <text x="75" y="312" class="text" style="text-anchor: start; font-size: 11px;">Primary Selection</text>
  
  <rect x="220" y="300" width="16" height="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2" rx="3"/>
  <text x="245" y="312" class="text" style="text-anchor: start; font-size: 11px;">Selection Level</text>
  
  <rect x="390" y="300" width="16" height="16" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" rx="3"/>
  <text x="415" y="312" class="text" style="text-anchor: start; font-size: 11px;">Favorites Sub-level</text>
</svg>

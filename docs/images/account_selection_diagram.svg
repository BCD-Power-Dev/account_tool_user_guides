<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    .box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2; rx: 8; }
    .box-header { fill: #3b82f6; stroke: #3b82f6; stroke-width: 2; }
    .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #1e293b; text-anchor: middle; }
    .text-white { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #ffffff; text-anchor: middle; font-weight: 600; }
    .text-small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
    .line { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .arrow { fill: #94a3b8; }
  </style>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Account Selection (Top) -->
  <rect x="300" y="20" width="200" height="44" class="box-header" rx="8"/>
  <text x="400" y="47" class="text-white">Account Selection</text>
  
  <!-- Connecting lines from top -->
  <path d="M 400 64 L 400 90 L 400 110" class="line"/>
  <path d="M 400 90 L 100 90 L 100 110" class="line"/>
  <path d="M 400 90 L 270 90 L 270 110" class="line"/>
  <path d="M 400 90 L 530 90 L 530 110" class="line"/>
  <path d="M 400 90 L 700 90 L 700 110" class="line"/>
  
  <!-- Arrows -->
  <polygon points="100,110 95,100 105,100" class="arrow"/>
  <polygon points="270,110 265,100 275,100" class="arrow"/>
  <polygon points="400,110 395,100 405,100" class="arrow"/>
  <polygon points="530,110 525,100 535,100" class="arrow"/>
  <polygon points="700,110 695,100 705,100" class="arrow"/>
  
  <!-- Level boxes (Row 2) -->
  <!-- GCN Level -->
  <rect x="30" y="115" width="140" height="40" class="box"/>
  <text x="100" y="140" class="text">GCN Level</text>
  
  <!-- Country (SMID) Level -->
  <rect x="190" y="115" width="160" height="40" class="box"/>
  <text x="270" y="140" class="text">Country (SMID) Level</text>
  
  <!-- Entity (LCN/TSPM) Level -->
  <rect x="370" y="115" width="170" height="40" class="box"/>
  <text x="455" y="133" class="text">Entity (LCN/TSPM)</text>
  <text x="455" y="148" class="text">Level</text>
  
  <!-- Favorites -->
  <rect x="630" y="115" width="140" height="40" class="box"/>
  <text x="700" y="140" class="text">Favorites</text>
  
  <!-- Connecting lines from Favorites -->
  <path d="M 700 155 L 700 200 L 700 220" class="line"/>
  <path d="M 700 200 L 550 200 L 550 220" class="line"/>
  <path d="M 700 200 L 850 200 L 850 220" class="line"/>
  
  <!-- Arrows for favorites children -->
  <polygon points="550,220 545,210 555,210" class="arrow"/>
  <polygon points="850,220 845,210 855,210" class="arrow"/>
  
  <!-- Favorites sub-boxes -->
  <!-- Country (SMID) Fav -->
  <rect x="460" y="225" width="180" height="40" class="box" style="stroke: #8b5cf6;"/>
  <text x="550" y="250" class="text">Country (SMID) Fav</text>
  
  <!-- Entity (LCN) Fav -->
  <rect x="760" y="225" width="160" height="40" class="box" style="stroke: #8b5cf6;"/>
  <text x="840" y="250" class="text">Entity (LCN) Fav</text>
  
  <!-- Legend -->
  <rect x="30" y="320" width="16" height="16" fill="#3b82f6" rx="3"/>
  <text x="55" y="332" class="text" style="text-anchor: start; font-size: 11px;">Primary Selection</text>
  
  <rect x="180" y="320" width="16" height="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2" rx="3"/>
  <text x="205" y="332" class="text" style="text-anchor: start; font-size: 11px;">Selection Level</text>
  
  <rect x="340" y="320" width="16" height="16" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" rx="3"/>
  <text x="365" y="332" class="text" style="text-anchor: start; font-size: 11px;">Favorites Sub-level</text>
</svg>
